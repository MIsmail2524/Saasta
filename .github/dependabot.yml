version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
